name: Check flag status

on:
  schedule:
    - cron: '7,37 * * * *'   # twice an hour
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: flag-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Idaho flag status
        run: python scripts/update_flag.py

      - name: Commit if changed
        run: |
          git config user.name  "flag-bot"
          git config user.email "flag-bot@users.noreply.github.com"
          git add status.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Flag status: $(python -c "import json;d=json.load(open('status.json'));print(d['us'] or 'unknown')")"
            git push
          fi
